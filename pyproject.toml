[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aburrimiento"
version = "0.3.0"
description = "Group boredom analyzer: 14 sociological indicators, three-level classification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.scripts]
aburrimiento = "aburrimiento.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aburrimiento"]

[tool.ruff]
line-length = 100
target-version = "py313"
# legacy/ holds archived code that is never built, linted or tested.
extend-exclude = ["legacy", "0.2", "blueplan.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
